<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OurSpace</title>
<meta name="theme-color" content="#7C5CFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6FB;--surface:#FFFFFF;--surface2:#F4F3FA;--line:#ECEAF4;
  --text:#120D2E;--muted:#6B6882;
  --accent:#7C5CFA;--accent2:#9B7BFF;--accent-soft:#F0EBFF;
  --pos:#16A36A;--warn:#E8930C;--crit:#E5484D;
  --books:#8B5CF6;--books2:#A78BFA;--books-soft:#F4F0FF;
  --business:#F5A524;--business2:#FBBF24;--business-soft:#FFF6E6;
  --finance:#1FB574;--finance2:#34D399;--finance-soft:#EAF8F1;
  --shadow:0 1px 2px rgba(25,18,70,.04),0 10px 30px rgba(25,18,70,.06);
  --r:20px;
  --hill1:#EEE9FF;--hill2:#E2D9FF;--hill3:#D3C6FF;--tree:#A995F7;--house:#FFFFFF;--sun:#FCE9B8;
}
:root[data-theme="dark"]{
  --bg:#0D0A1C;--surface:#161229;--surface2:#1F1A38;--line:#2A2448;
  --text:#F4F2FF;--muted:#A39FBF;--accent-soft:#2A2252;
  --books-soft:#241C45;--business-soft:#2C2214;--finance-soft:#12291F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --hill1:#211A40;--hill2:#2A2150;--hill3:#352A63;--tree:#5B49B8;--house:#3B3170;--sun:#4A3F2A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}
.app{display:flex;min-height:100vh}

/* ---------- brand / sidebar ---------- */
.side{display:none}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(124,92,250,.3);flex-shrink:0}
.brand b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand small{color:var(--muted);font-size:13px;font-weight:500}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:18px 18px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.tools{display:flex;gap:10px;align-items:center}
.iconbtn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:52px;height:52px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);color:var(--text)}
.iconbtn .bcount{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--crit);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
#search,#theme{display:none}
.searchbox{display:none;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 14px;height:60px;box-shadow:var(--shadow)}
.searchbox.on{display:flex}
.searchbox input{border:0;background:none;padding:0;width:200px;outline:none}

.eyebrow{color:var(--muted);font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
h1{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px;line-height:1.15}
h2{font-size:18px;font-weight:700;margin:0}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.m{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.tile{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex-shrink:0}
.tile.soft{background:var(--accent-soft);color:var(--accent)}
.tile.sm{width:44px;height:44px;border-radius:50%}

/* banner */
.banner{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:18px;margin-bottom:16px;background:linear-gradient(90deg,var(--surface) 40%,var(--accent-soft))}
.banner .bt{width:56px;height:56px;border-radius:16px;position:relative;z-index:1}
.banner .txt{position:relative;z-index:1}
.banner .txt b{display:block;font-size:18px;font-weight:800}
.banner .txt span{color:var(--muted);font-size:14px}
.banner .art{position:absolute;right:0;bottom:0;height:78%;width:150px;pointer-events:none;opacity:.9}
.banner .status{margin-left:auto;text-align:right;position:relative;display:none}
.banner .status b{display:block;color:var(--accent);font-size:21px;font-weight:800}
.banner .status.alert b{color:var(--warn)}
.banner .status span{color:var(--muted);font-size:13px}

/* department / project cards */
.dept{position:relative;cursor:pointer;border-left:4px solid var(--c);transition:transform .15s}
.dept:hover{transform:translateY(-2px)}
.dept .head{display:flex;align-items:flex-start;gap:14px}
.dept .dicon{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--c2),var(--c));display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:0 8px 18px -8px var(--c)}
.dept .name{font-weight:800;font-size:18px;line-height:1.25}
.dept .hint{color:var(--muted);font-size:14px;margin-top:2px}
.chev{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--c);display:grid;place-items:center;flex-shrink:0}
.pct{font-size:13px;color:var(--muted);margin-top:12px}
.bar{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:6px}
.bar + .pct{margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kpi{position:relative;background:var(--soft,var(--surface2));border-radius:14px;padding:34px 10px 12px 12px;min-width:0}
.kpi b{display:block;font-size:clamp(17px,4.8vw,22px);font-weight:800;line-height:1.15;white-space:nowrap}
.kpi span{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}
.kpi .ki{position:absolute;top:10px;right:8px;color:var(--c,var(--accent));display:block}
.kpi .ki svg{width:18px;height:18px}

/* list cards */
.chead{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.chead .more{margin-left:auto;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0;font-size:14px;white-space:nowrap}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{display:flex;align-items:center;gap:14px;min-width:0}
.row .ri{width:46px;height:46px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.row .t{font-weight:700}
.emptybox{border:1.5px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
.emptybox svg{margin:0 auto 6px}
.emptybox b{display:block;color:var(--muted);font-weight:500}

/* family card */
.fam{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.fam .av{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.fam b{display:block;font-weight:800;font-size:15px;color:var(--text)}
.fam span{color:var(--muted);font-size:13px}
.fam .ch{margin-left:auto;color:var(--muted)}
.fam-home{margin-top:16px}

/* settings sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(18,13,46,.35);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet h2{margin-bottom:4px}
.sheet .opt{margin-top:18px}
.sheet .opt > div:first-child{font-weight:700;margin-bottom:8px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.pending{color:var(--warn)}.pill.done,.pill.approved,.pill.success,.pill.reviewed{color:var(--pos)}
.pill.blocked,.pill.failed,.pill.rejected,.pill.investigate{color:var(--crit)}.pill.in_progress{color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.pos{background:var(--pos)}.btn.crit{background:var(--crit)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline-color:var(--accent)}
textarea{min-height:120px;resize:vertical}
.form{display:grid;gap:10px}
.inline{display:flex;gap:10px}
.inline > *{flex:1}
.money{font-variant-numeric:tabular-nums}
.neg{color:var(--crit)}.posv{color:var(--pos)}
.big{font-size:28px;font-weight:800;margin:4px 0 0}
.catbar{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.catbar .bar{margin:0}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:700}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .bars i{width:40%;max-width:18px;border-radius:6px 6px 0 0;min-height:2px}
.chart small{color:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:30;display:none;max-width:90%;font-weight:600;box-shadow:var(--shadow)}
.toast.err{background:var(--crit);color:#fff}
.hide-sm{display:none}

/* login */
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.login.on{display:flex}
.login .box{width:100%;max-width:400px}
.login .brand{margin-bottom:28px}
.login h1{font-size:30px;margin-bottom:6px}
.login .form{margin-top:20px}
.login label{font-weight:700;font-size:14px;margin-bottom:-4px}
.login .err{color:var(--crit);font-weight:600;font-size:14px;min-height:20px}
.login .lsw{display:flex;gap:8px;margin-top:22px;justify-content:center}
.login .lsw button{background:none;border:0;color:var(--muted);font-weight:700;cursor:pointer;padding:6px 10px;border-radius:10px}
.login .lsw button.on{color:var(--accent);background:var(--accent-soft)}
.btn.block{width:100%;padding:14px}

/* missions */
.mrow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mchk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:#fff;flex-shrink:0;margin-top:1px}
.mrow.done .mchk{background:var(--pos);border-color:var(--pos)}
.mrow.done .mt{text-decoration:line-through;color:var(--muted)}
.mt{font-weight:700}
.mtag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.mtag.carry{background:#FFF6E6;color:var(--warn)}
.mtip{font-size:12.5px;color:var(--muted);margin-top:2px}
.madd{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.madd input{flex:1 1 180px}
.madd select{flex:0 0 auto;width:auto}
.madd .btn{flex:1 1 auto}
.micbtn{width:46px;height:46px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.mfoot{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.mfoot .btn{display:flex;align-items:center;gap:8px}
.msum{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.prog{font-weight:800;color:var(--accent);margin-left:auto;font-size:15px}

/* calendar */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calhead h2{flex:1}
.calnav{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.mgrid .wd{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase}
.mgrid .d{position:relative;border:0;background:none;border-radius:12px;padding:8px 0 12px;cursor:pointer;font-weight:600;color:var(--text);font-size:14px}
.mgrid .d.out{color:var(--muted);opacity:.45}
.mgrid .d.today{background:var(--accent-soft);color:var(--accent)}
.mgrid .d.sel{background:var(--accent);color:#fff}
.mgrid .d .dots{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:2px}
.mgrid .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.mgrid .d.sel .dots i{background:#fff}
.evrow .when{min-width:58px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:6px 4px;font-weight:800;line-height:1.1;flex-shrink:0}
.evrow .when small{display:block;font-size:11px;font-weight:700;text-transform:uppercase}
.evrow .when b{font-size:20px}
.cd{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.cd.soon{background:#FDECEC;color:var(--crit)}
.cd.near{background:#FFF6E6;color:var(--warn)}
.trash{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:10px}
.trash:hover{background:var(--surface2);color:var(--crit)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.actions .btn{display:flex;align-items:center;gap:8px}
.remnote{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--text);border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:16px}
.remnote svg{color:var(--accent);margin-top:1px}
.found{border:1.5px dashed var(--accent);border-radius:16px;padding:14px;margin-top:12px}
.tools2{display:flex;gap:8px}
.tools2 .btn{display:flex;align-items:center;gap:8px;flex:1;justify-content:center}
.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
input[type=file].hid{display:none}

/* bottom nav (mobile) */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{position:relative;background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 4px 10px}
.nav button.on{color:var(--accent)}
.nav button.on::after{content:"";position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.badge{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;margin-left:6px;font-weight:700}

@media (min-width:700px){
  .banner .status{display:block}
  .banner .art{right:220px;width:300px;height:100%}
  h1{font-size:36px}
  .hide-sm{display:block}
}
@media (min-width:1000px){
  .side{display:flex;flex-direction:column;gap:6px;width:300px;padding:26px 18px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;flex-shrink:0}
  .side > .brand{margin:0 8px 34px}
  .side .navi{display:flex;align-items:center;gap:18px;background:none;border:0;padding:15px 22px;border-radius:16px;cursor:pointer;color:var(--text);text-align:left;font-size:17px;font-weight:500}
  .side .navi:hover{background:var(--surface2)}
  .side .navi.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .side .spacer{flex:1}
  .side .fam{border-radius:18px}
  .nav{display:none}
  .fam-home{display:none}
  .main{padding:30px 40px 40px}
  .top{margin-bottom:0}
  .top .brand{visibility:hidden}
  #search,#theme{display:grid}
  .tools{gap:16px}
  .iconbtn{width:60px;height:60px;border-radius:18px}
  .iconbtn .dot{top:11px;right:13px}
  .grid.d3{grid-template-columns:repeat(3,1fr)}
  .grid.d2{grid-template-columns:1.45fr 1fr}
  .toast{bottom:30px}
  h1{font-size:46px}
  .hero{margin-top:-34px}
  .banner{padding:22px 26px}
  .sheet-bg{align-items:center}
  .sheet{border-radius:24px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="top">
      <div class="brand" id="topbrand"></div>
      <div class="tools">
        <div class="searchbox" id="sbox"><span id="sic"></span><input id="sq"></div>
        <button class="iconbtn" id="search"></button>
        <button class="iconbtn" id="cal"></button>
        <button class="iconbtn" id="bell"></button>
        <button class="iconbtn" id="theme"></button>
      </div>
    </div>
    <div id="view"><div class="loading">Loading…</div></div>
  </main>
</div>
<nav class="nav" id="nav"></nav>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="login" id="login"></div>

<script>
/* ---------- i18n ---------- */
const STR = {
  en: {
    loc:'en-AU', home:'Home', projects:'Projects', ai:'AI', aiCmd:'AI Command', approvals:'Approvals', finance:'Finance',
    morning:'Good morning', afternoon:'Good afternoon', evening:'Good evening', welcome:'Welcome to OurSpace!',
    summary:'Summary', noPending:'No pending approvals', nPending:n=>n+' pending approval'+(n>1?'s':''), nBlocked:n=>n+' blocked task'+(n>1?'s':''),
    allGood:'All caught up!', keepUp:'Keep up the great work.', attention:'Heads up', waiting:'Some items are waiting for you.',
    d_books:'Books & Publishing', d_business:'Business & Projects', d_finance:'Personal Finance',
    h_books:'Nirvana City, Beyond Illusion', h_business:'RotorLog, PCH Toolbox & more', h_finance:'Accounts & family budget',
    noMs:'No milestones set — progress not measured', pctDone:p=>p+'% of milestones completed',

];
const DEPT_META = {
  books:{c:'var(--books)', c2:'var(--books2)', soft:'var(--books-soft)', ic:'book'},
  business:{c:'var(--business)', c2:'var(--business2)', soft:'var(--business-soft)', ic:'building'},
  finance:{c:'var(--finance)', c2:'var(--finance2)', soft:'var(--finance-soft)', ic:'dollar'}
};
const S = {data:null, view:'home', dept:'all', project:null, q:'', actAll:false};

/* ---------- helpers ---------- */
const API_URL = 'https://script.google.com/macros/s/AKfycbw6s46dWmDbtyS1ZnnueWNsqwOvIFTgXTiozHASRWXo3q-Fouxcyr2mXKyKNTYSDxgo/exec';
function getToken(){ try{ return localStorage.getItem('os_token') || ''; }catch(e){ return ''; } }
function setToken(t){ try{ if (t) localStorage.setItem('os_token', t); else localStorage.removeItem('os_token'); }catch(e){} }
async function rpc(body){
  let r;
  try { r = await fetch(API_URL, {method:'POST', body: JSON.stringify(body), redirect:'follow'}); }
  catch(e){ throw new Error('NETWORK'); }
  let j; try { j = await r.json(); } catch(e){ throw new Error('NETWORK'); }
  if (!j.ok) throw new Error(j.error || 'ERROR');
  return j.data;
}
async function call(fn, ...args){
  try { return await rpc({fn, args, token:getToken()}); }
  catch(e){ if (e.message==='AUTH_REQUIRED' || e.message==='NOT_AUTHORISED'){ setToken(''); showLogin(T(e.message)); } throw e; }
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function aud(n){return Number(n||0).toLocaleString('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0});}
function aud2(n){return Number(n||0).toLocaleString('en-AU',{style:'currency',currency:'AUD'});}
function stName(s){return T('st')[s]||s;}
function pill(s){return `<span class="pill ${esc(s)}">${esc(stName(s))}</span>`;}
function when(ts){
  if(!ts) return '';
  const d = new Date(String(ts).length<=10 ? ts+'T00:00:00' : ts);
  if (isNaN(d)) return esc(ts);
  const diff = (Date.now()-d)/60000;
  if (diff>=0 && diff<1) return T('just');
  if (diff>=0 && diff<60) return T('minAgo')(Math.round(diff));
  if (diff>=0 && diff<1440) return T('hAgo')(Math.round(diff/60));
  return d.toLocaleDateString(T('loc'),{day:'2-digit',month:'short'});
}
function toast(msg, err){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast'+(err?' err':''); t.style.display='block';
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', 3500);
}
function errMsg(e){const m = (e && e.message ? e.message : String(e)).replace(/^Exception:\s*/,''); const t = (STR[LANG]||STR.en)[m] || (STR[LANG]||STR.en)[m.split(' ')[0]]; return typeof t==='string' ? t : m;}
async function act(fn, args, okMsg){
  try { await call(fn, ...args); if(okMsg) toast(okMsg); await load(true); }
  catch(e){ toast(errMsg(e), true); }
}
function deptName(k){ return T('d_'+k) || ((S.data.departments||[]).find(x=>x.key===k)||{}).name || k; }
function vars(m){return `--c:${m.c};--c2:${m.c2};--soft:${m.soft}`;}
function progressBlock(p){
  if (p==null) return `<div class="pct">${T('noMs')}</div>`;
  return `<div class="bar"><i style="width:${p}%"></i></div><div class="pct">${T('pctDone')(p)}</div>`;
}
function kpi(v, label, icon){return `<div class="kpi"><b class="money">${esc(v)}</b><span>${label}</span><span class="ki">${ic(icon,20)}</span></div>`;}
function actIcon(a){
  const k = String(a||'');
  if (k==='setup' || k.indexOf('member')===0) return 'term';
  if (k.indexOf('task')===0) return 'listic';
  if (k.indexOf('milestone')===0 || k.indexOf('approval')===0) return 'checkc';
  if (k.indexOf('project')===0) return 'doc';
  if (k.indexOf('instruction')===0) return 'sparko';
  if (k.indexOf('tx')===0) return 'dollar';
  return 'clock';
}
const BRAND = `<div class="logo">${ic('ring',26)}</div><div><b>OurSpace</b><small>Family Command Centre</small></div>`;
function famCard(id, cls){ return `<button class="fam ${cls||''}" id="${id}"><span class="av">${ic('users',24)}</span><span><b>${T('family')}</b><span>${T('shared')}</span></span><span class="ch">${ic('chev',20)}</span></button>`; }

/* ---------- settings sheet (Nossa Família) ---------- */
function openSheet(){
  const u = S.data.user, th = document.documentElement.dataset.theme;
  const langOpt = u.isOwner ? `<div class="m" style="margin-top:14px">${T('enOnly')}</div>` :
    `<div class="opt"><div>${T('language')}</div><div class="seg"><button data-lang="pt" class="${LANG==='pt'?'on':''}">Português</button><button data-lang="en" class="${LANG==='en'?'on':''}">English</button></div></div>`;
  document.getElementById('sheet').innerHTML =
    `<div class="chead" style="border:0;padding:0"><span class="fam" style="border:0;box-shadow:none;padding:0;cursor:default"><span class="av">${ic('users',24)}</span><span><b>${T('family')}</b><span>${T('signedAs')} ${esc(u.name)} · ${esc(u.email)}</span></span></span></div>
     ${langOpt}
     <div class="opt"><div>${T('theme')}</div><div class="seg"><button data-th="light" class="${th!=='dark'?'on':''}">${T('light')}</button><button data-th="dark" class="${th==='dark'?'on':''}">${T('dark')}</button></div></div>
     <div class="opt"><div>${T('notifTitle')}</div><button class="btn ghost" id="notif_go" style="width:100%">${('Notification' in window && Notification.permission==='granted')?T('notifOk'):T('notifOn')}</button><div class="m" style="margin-top:6px">${T('notifHint')}</div></div>
     <div class="opt"><div>${T('changePin')}</div><div class="form"><div class="inline"><input id="pin_old" type="password" inputmode="numeric" autocomplete="current-password" placeholder="${T('curPin')}"><input id="pin_new" type="password" inputmode="numeric" autocomplete="new-password" placeholder="${T('newPin')}"></div><button class="btn ghost" id="pin_go">${T('savePin')}</button></div></div>
     <div class="inline" style="margin-top:20px"><button class="btn ghost" id="signout">${T('signOut')}</button><button class="btn" id="sheetclose">${T('close')}</button></div>`;
  document.getElementById('sheetbg').classList.add('on');
  document.getElementById('sheetclose').onclick = closeSheet;
  document.getElementById('notif_go').onclick = enableNotifications;
  document.getElementById('signout').onclick = async () => { const t = getToken(); setToken(''); closeSheet(); showLogin(''); try{ await rpc({fn:'logout', token:t}); }catch(e){} };
  document.getElementById('pin_go').onclick = async () => {
    try { await call('api_changePin', document.getElementById('pin_old').value, document.getElementById('pin_new').value); toast(T('pinChanged')); closeSheet(); }
    catch(e){ toast(errMsg(e), true); }
  };
  document.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { applyTheme(b.dataset.th); openSheet(); });
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = async () => {
    const l = b.dataset.lang; if (l===LANG) return;
    LANG = l; S.data.user.lang = l; try{localStorage.setItem('os_lang', l);}catch(e){}
    render(); openSheet();
    try { await call('api_setLang', l); } catch(e){ toast(errMsg(e), true); }
  });
}
function closeSheet(){ document.getElementById('sheetbg').classList.remove('on'); }

/* ---------- navigation ---------- */
function renderNav(){
  const pend = S.data ? S.data.approvals_pending.length : 0;
  const isOn = n => S.view===n.k || (n.k==='projects' && S.view==='project');
  document.getElementById('nav').innerHTML = NAV.filter(n=>!n.desk).map(n => `<button class="${isOn(n)?'on':''}" data-go="${n.k}">${ic(isOn(n)?n.ic:n.ico,26,1.8)}<span>${T(n.ls||n.l)}</span></button>`).join('');
  document.getElementById('side').innerHTML =
    `<div class="brand">${BRAND}</div>` +
    NAV.map(n => `<button class="navi ${isOn(n)?'on':''}" data-go="${n.k}">${ic(n.ic,24)}<span>${T(n.l)}${n.k==='approvals'&&pend?`<span class="badge">${pend}</span>`:''}</span></button>`).join('') +
    `<div class="spacer"></div>` + famCard('fam');
  const bcount = (S.badge && S.badge.count) || pend;
  document.getElementById('bell').innerHTML = ic('bell', 24) + (bcount ? `<span class="bcount">${bcount>9?'9+':bcount}</span>` : '');

  document.getElementById('cal').title = T('openCal');

  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  document.getElementById('fam').onclick = openSheet;
}
function go(v, extra){ S.view = v; Object.assign(S, extra||{}); render(); window.scrollTo(0,0); }

async function load(keepView){
  if (!getToken()) { showLogin(''); return; }
  try { S.data = await call('api_bootstrap'); }
  catch(e){ document.getElementById('view').innerHTML = `<div class="card">${T('error')}${esc(errMsg(e))}</div>`; return; }
  LANG = S.data.user.lang === 'pt' ? 'pt' : 'en';
  try{ localStorage.setItem('os_lang', LANG); }catch(e){}
  document.getElementById('login').classList.remove('on');
  if (S.view==='project' && S.project) { try{ S.projectData = await call('api_getProject', S.project); }catch(e){} }
  render();
  loadCal();
  loadMissions();
  loadBadge();
  shareToken();
}
async function loadMissions(){
  try { S.ms = await call('api_missions'); if (S.view==='home') render(); } catch(e){}
}
async function loadBadge(){
  try {
    S.badge = await call('api_badge');
    try { if ('setAppBadge' in navigator) { S.badge.count ? navigator.setAppBadge(S.badge.count) : navigator.clearAppBadge(); } } catch(e){}
    renderNav(); if (S.view==='home') render();
  } catch(e){}
}
async function loadCal(){
  try { S.cal = await call('api_calendar', S.calMonth || ''); if (S.view==='home' || S.view==='calendar') render(); }
  catch(e){ S.calErr = errMsg(e); if (S.view==='calendar') render(); }
}

function render(){
  renderNav();
  const v = document.getElementById('view');
  const views = {home:vHome, projects:vProjects, project:vProject, calendar:vCalendar, command:vCommand, approvals:vApprovals, finance:vFinance};
  v.innerHTML = (views[S.view]||vHome)();
  bind();
}

function startVoice(btn, onText){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast(T('noVoice'), true); return; }
  if (REC) { REC.stop(); return; }
  REC = new SR(); REC.lang = LANG==='pt' ? 'pt-BR' : 'en-AU'; REC.interimResults = false; REC.continuous = false;
  REC.onresult = ev => { let t=''; for (let i=ev.resultIndex;i<ev.results.length;i++) if (ev.results[i].isFinal) t += ev.results[i][0].transcript; if (t) onText(t.trim()); };
  REC.onend = () => { REC = null; btn.classList.remove('rec'); };
  REC.onerror = () => {};
  REC.start(); btn.classList.add('rec'); toast(T('listening'));
}

async function imgToJpeg(file, max){
  max = max || 1600;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth*k); cv.height = Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.85).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}

  $('ev_photo').onclick = () => $('ev_file').click();
  $('ev_file').onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    S.calReading = true; S.calFound = null; render();
    try { const b64 = await imgToJpeg(f); const evs = await call('api_scanEvent', b64, 'image/jpeg'); S.calFound = evs.length ? evs : null; if (!evs.length) toast(T('nothingFound'), true); }
    catch(err){ toast(errMsg(err), true); }
    S.calReading = false; render();
  };
  $('m_prev').onclick = () => shiftMonth(-1);
  $('m_next').onclick = () => shiftMonth(1);
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { S.calSel = S.calSel===b.dataset.day ? null : b.dataset.day; if (S.calForm && !S.calForm.title) S.calForm = {date:S.calSel}; render(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm(T('delConfirm'))) return;
    try { await call('api_deleteEvent', b.dataset.del); toast(T('eventDeleted')); await loadCal(); } catch(e){ toast(errMsg(e), true); }
  });
  document.querySelectorAll('[data-fedit]').forEach(b => b.onclick = () => { S.calForm = S.calFound[+b.dataset.fedit]; render(); const c = $('evcard'); if (c) c.scrollIntoView({behavior:'smooth'}); });
  document.querySelectorAll('[data-fadd]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.fadd; b.disabled = true;
    try { await call('api_createEvent', S.calFound[i]); toast(T('eventAdded')); S.calFound.splice(i,1); if (!S.calFound.length) S.calFound = null; await loadCal(); }
    catch(e){ toast(errMsg(e), true); b.disabled = false; }
  });
  if ($('ev_save')) $('ev_save').onclick = async () => {
    const ev = {title:$('ev_title').value, date:$('ev_date').value, start:$('ev_start').value, end:$('ev_end').value, location:$('ev_loc').value, notes:$('ev_notes').value};
    $('ev_save').disabled = true;
    try { await call('api_createEvent', ev); toast(T('eventAdded')); S.calForm = null; await loadCal(); }
    catch(e){ toast(errMsg(e), true); $('ev_save').disabled = false; }
  };
}
function shiftMonth(n){
  const mm = (S.cal && S.cal.month) || ymd(new Date()).slice(0,7);
  const [Y, M] = mm.split('-').map(Number); const d = new Date(Y, M-1+n, 1);
  S.calMonth = ymd(d).slice(0,7); S.calSel = null; loadCal();
}

/* ---------- AI command: voice + photo ---------- */
let REC = null;
function bindCommandTools(){
  const $ = id => document.getElementById(id);
  if (!$('ci_mic')) return;
  $('ci_mic').onclick = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast(T('noVoice'), true); return; }
    if (REC) { REC.stop(); return; }
    REC = new SR(); REC.lang = LANG==='pt' ? 'pt-BR' : 'en-AU'; REC.interimResults = false; REC.continuous = true;
    REC.onresult = ev => { let t=''; for (let i=ev.resultIndex;i<ev.results.length;i++) if (ev.results[i].isFinal) t += ev.results[i][0].transcript; if (t) { const ta = $('ci_text'); ta.value = (ta.value ? ta.value.trim()+' ' : '') + t.trim(); } };
    REC.onend = () => { REC = null; const b = $('ci_mic'); if (b) { b.classList.remove('rec'); b.innerHTML = ic('mic',18)+' '+T('voice'); } };
    REC.onerror = () => {};
    REC.start(); $('ci_mic').classList.add('rec'); $('ci_mic').innerHTML = ic('mic',18)+' '+T('listening'); 
  };
  $('ci_photo').onclick = () => $('ci_file').click();
  $('ci_file').onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const b = $('ci_photo'); b.disabled = true; b.innerHTML = ic('camera',18)+' '+T('reading');
    try { const b64 = await imgToJpeg(f); const txt = await call('api_describeImage', b64, 'image/jpeg', LANG); const ta = $('ci_text'); ta.value = (ta.value ? ta.value.trim()+'\n\n' : '') + '[' + T('photo') + '] ' + txt; toast(T('photoAdded')); }
    catch(err){ toast(errMsg(err), true); }
    b.disabled = false; b.innerHTML = ic('camera',18)+' '+T('photo');
  };
}

/* ---------- events ---------- */
function bind(){
  const $ = id => document.getElementById(id);
  bindCalendar(); bindCommandTools(); bindMissions();
  document.querySelectorAll('#view [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll('[data-dept]').forEach(c => c.onclick = () => c.dataset.dept==='finance' ? go('finance') : go('projects',{dept:c.dataset.dept}));
  document.querySelectorAll('[data-chip]').forEach(c => c.onclick = () => go('projects',{dept:c.dataset.chip}));
  document.querySelectorAll('[data-project]').forEach(c => c.onclick = async () => {
    S.project = c.dataset.project; S.projectData = null; go('project');
    try { S.projectData = await call('api_getProject', S.project); render(); } catch(e){ toast(errMsg(e), true); }
  });
  if ($('fam2')) $('fam2').onclick = openSheet;
  if ($('actmore')) $('actmore').onclick = () => { S.actAll = !S.actAll; render(); };
  if ($('budall')) $('budall').onclick = () => { S.budAll = !S.budAll; render(); };
  if ($('np_go')) $('np_go').onclick = () => act('api_createProject', [S.dept, $('np_name').value, $('np_desc').value], T('projCreated'));
  if ($('nt_go')) $('nt_go').onclick = () => act('api_createTask', [S.project, $('nt_title').value, $('nt_pri').value, $('nt_due').value], T('taskAdded'));
  if ($('nm_go')) $('nm_go').onclick = () => act('api_createMilestone', [S.project, $('nm_title').value, $('nm_due').value], T('msAdded'));
  document.querySelectorAll('[data-msdone]').forEach(b => b.onclick = () => {
    const ev = prompt(T('evPrompt'));
    if (ev) act('api_completeMilestone', [b.dataset.msdone, ev], T('msDone'));
  });
  document.querySelectorAll('[data-task]').forEach(s => s.onchange = () => act('api_updateTaskStatus', [s.dataset.task, s.value], T('statusUpd')));
  document.querySelectorAll('[data-tx]').forEach(s => s.onchange = () => act('api_setTransactionReview', [s.dataset.tx, s.value, ''], T('txUpd')));
  document.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => {
    if (!confirm(T('confirm')[b.dataset.dec])) return;
    const n = document.getElementById('an_'+b.dataset.id);
    act('api_decideApproval', [b.dataset.id, b.dataset.dec, n?n.value:''], T('decSaved'));
  });
  if ($('ci_go')) $('ci_go').onclick = async () => {
    $('ci_go').disabled = true;
    await act('api_submitInstruction', [$('ci_text').value, $('ci_dept').value], T('instrSent'));
  };
  if ($('fin_month')) $('fin_month').onchange = async e => {
    try { S.data.finance = await call('api_finance', e.target.value); render(); } catch(err){ toast(errMsg(err), true); }
  };
  if ($('fin_sync')) $('fin_sync').onclick = async () => {
    $('fin_sync').disabled = true; toast(T('syncing'));
    try { const r = await call('api_syncNow'); toast(r.status==='success'?T('synced')(r.transactions):(r.message||r.status), r.status==='failed'); await load(true); }
    catch(e){ toast(errMsg(e), true); }
  };
}

/* ---------- phone notifications (service worker + periodic sync) ---------- */
async function shareToken(){
  try {
    if (!('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.ready;
    if (reg.active) reg.active.postMessage({type:'auth', token:getToken(), lang:LANG, api:API_URL});
  } catch(e){}
}
async function enableNotifications(){
  if (!('Notification' in window) || !('serviceWorker' in navigator)) { toast(T('notifNo'), true); return; }
  let perm = Notification.permission;
  if (perm !== 'granted') perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast(T('notifDenied'), true); return; }
  await shareToken();
  const reg = await navigator.serviceWorker.ready;
  try { if ('periodicSync' in reg) await reg.periodicSync.register('os-reminders', {minInterval: 6*60*60*1000}); } catch(e){}
  try { reg.active && reg.active.postMessage({type:'check', force:true}); } catch(e){}
  toast(T('notifOk')); openSheet();
}

/* ---------- login ---------- */
function showLogin(msg){
  const el = document.getElementById('login');
  let email = ''; try{ email = localStorage.getItem('os_email') || ''; }catch(e){}
  el.innerHTML = `<div class="box"><div class="brand">${BRAND}</div>
    <h1>${T('signIn')}</h1><p class="sub" style="margin:0">${T('loginSub')}</p>
    <form class="form" id="lform" autocomplete="on">
      <label for="l_email">${T('emailL')}</label><input id="l_email" type="email" autocomplete="username" required value="${esc(email)}">
      <label for="l_pin">${T('pinL')}</label><input id="l_pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" required>
      <div class="err" id="l_err">${esc(msg||'')}</div>
      <button class="btn block" id="l_go" type="submit">${T('signInBtn')}</button>
    </form>
    <div class="lsw"><button data-ll="en" class="${LANG==='en'?'on':''}">English</button><button data-ll="pt" class="${LANG==='pt'?'on':''}">Português</button></div></div>`;
  el.classList.add('on');
  el.querySelectorAll('[data-ll]').forEach(b => b.onclick = () => { LANG = b.dataset.ll; try{localStorage.setItem('os_lang', LANG);}catch(e){} showLogin(''); });
  document.getElementById('lform').onsubmit = async ev => {
    ev.preventDefault();
    const btn = document.getElementById('l_go'); btn.disabled = true;
    const em = document.getElementById('l_email').value.trim();
    try {
      const r = await rpc({fn:'login', email: em, pin: document.getElementById('l_pin').value});
      setToken(r.token); try{ localStorage.setItem('os_email', em); }catch(e){}
      el.classList.remove('on'); S.view = 'home';
      document.getElementById('view').innerHTML = `<div class="loading">${LANG==='pt'?'Carregando…':'Loading…'}</div>`;
      await load(true);
    } catch(e){ document.getElementById('l_err').textContent = errMsg(e); btn.disabled = false; }
  };
}

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
load();
</script>
